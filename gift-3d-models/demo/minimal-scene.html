<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최소 통합 예제</title>
<style>html,body{margin:0;height:100%;background:#151226;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// 다른 three.js 장면에 두 모델을 넣는 가장 짧은 예제
import * as THREE from "three";
import { createSeal, createSword, applyEnvironment } from "../src/models.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 필수: 금속 반사가 하얗게 날아가지 않게
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151226);
applyEnvironment(renderer, scene);                     // 필수: 금속/광택 재질용 환경맵
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 1.5, 1.2); scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 1.4, 5.2); camera.lookAt(0, 0.85, 0);

const seal = createSeal();               // 바닥이 y=0, 얼굴이 +Z
seal.position.set(-1.0, 0, 0);
scene.add(seal);

const sword = createSword();             // 중심이 원점, 칼끝이 +Y
sword.position.set(1.1, 1.1, 0);       // 길이 2.12 → 바닥에서 띄우려면 y ≈ 1.06 이상
sword.rotation.z = -0.25;
scene.add(sword);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  seal.userData.update(dt, t);          // 헤엄(지느러미·몸 들썩임·공기방울)
  sword.userData.update(dt, t);         // 무지개 흐름·발광 맥동·스파크
  seal.rotation.y = Math.sin(t * 0.6) * 0.6;
  sword.rotation.y = t * 0.8;
  renderer.render(scene, camera);
});
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.ok = true;
</script>
</body>
</html>
